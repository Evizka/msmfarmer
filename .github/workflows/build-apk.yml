name: Build APK

permissions:
  contents: write

env:
  RELEASE_TAG: v1.3.0

on:
  push:
    branches:
      - arena/92c12fdb-msmfarmer
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 36 and build tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -path '*/bin/sdkmanager' -type f | head -1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Ensure persistent signing keystore
        run: |
          if [ ! -f app/msm-farmer.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/msm-farmer.keystore \
              -alias msmfarmer \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass msmfarmer -keypass msmfarmer \
              -dname "CN=MSM Farmer, OU=Dev, O=MSM Farmer, L=Moscow, ST=Moscow, C=RU" >/dev/null 2>&1
            git config user.name "ci-bot"
            git config user.email "ci-bot@users.noreply.github.com"
            git add -f app/msm-farmer.keystore
            git commit -m "ci: add persistent signing keystore [skip ci]" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: msm-farmer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit APK to branch
        if: success()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          cp app/build/outputs/apk/debug/app-debug.apk msm-farmer-debug.apk
          git add -f msm-farmer-debug.apk
          git commit -m "ci: built debug APK [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      - name: Compare signing certificates
        if: success()
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          git fetch --unshallow origin "refs/heads/${GITHUB_REF_NAME}" >/dev/null 2>&1 || git fetch origin >/dev/null 2>&1 || true
          {
            echo "=== current ==="
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | grep -i 'SHA-256' || true
            echo "=== first build (ec5fe0d) ==="
            git show ec5fe0d:msm-farmer-debug.apk > /tmp/old.apk
            "$APKSIGNER" verify --print-certs /tmp/old.apk 2>/dev/null | grep -i 'SHA-256' || true
            echo "=== debug keystore ==="
            ls -l "$HOME/.android/debug.keystore" 2>/dev/null || echo missing
            base64 -w0 "$HOME/.android/debug.keystore" 2>/dev/null | head -c 120 || true
          } > signing-info.txt 2>&1
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f signing-info.txt
          git commit -m "ci: signing info [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      - name: Publish GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" msm-farmer-debug.apk design/app-icon.png --clobber
          else
            gh release create "$RELEASE_TAG" msm-farmer-debug.apk design/app-icon.png \
              --target "${GITHUB_REF_NAME}" \
              --title "MSM Farmer 1.3.0" \
              --notes-file RELEASE_NOTES.md
          fi

      - name: Commit build log on failure
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f build-log.txt
          git commit -m "ci: build log [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
